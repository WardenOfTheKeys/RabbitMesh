# Builds RabbitMesh and publishes a GitHub Release with the two flash files: when a version tag
# (v0.1.0, v0.1.1, ...) is pushed, or from the Actions tab (Run workflow, with the version), which
# tags the commit it builds. The version has to match RABBITMESH_VERSION in the patch.
# Release notes come from docs/releases/<tag>.md when there is one.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v0.1.1 (must match RABBITMESH_VERSION)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag matches the firmware's version
        run: |
          v="${TAG#v}"
          grep -q "RABBITMESH_VERSION=\\\\\"$v\\\\\"" patches/rabbitmesh-tdeck.patch || {
            echo "tag $TAG doesn't match RABBITMESH_VERSION in patches/rabbitmesh-tdeck.patch"; exit 1; }

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('patches/rabbitmesh-tdeck.patch') }}
          restore-keys: pio-

      - name: Host tests
        run: test/run.sh

      - name: Build
        run: |
          pip install platformio
          ./setup.sh build
          cd build && pio run -e t-deck-rabbit

      - name: The two flash files
        run: |
          v="${TAG#v}"
          B=build/.pio/build/t-deck-rabbit
          python3 ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin \
            -o "rabbitmesh-$v-tdeck-full.bin" --flash_mode dio --flash_size 16MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
          cp $B/firmware.bin "rabbitmesh-$v-tdeck-update.bin"
          sha256sum rabbitmesh-*.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "RabbitMesh $v" "$@" \
            "rabbitmesh-$v-tdeck-full.bin" "rabbitmesh-$v-tdeck-update.bin" SHA256SUMS.txt
